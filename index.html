<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PetCycle</title>
  <style>
    :root { --bg:#FFF9F3; --card:#FFFFFF; --ink:#4A3F3A; --ink2:#8A7D74; --primary:#FF9E8C; --primaryShadow:#E8826F; --line:#EBDFD3; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif; padding:24px; }
    .card { background:var(--card); border:1.5px solid var(--line); border-radius:26px; max-width:360px; width:100%;
      padding:40px 28px; text-align:center; box-shadow:0 8px 28px rgba(90,74,66,.08); }
    .paw { font-size:50px; }
    h1 { font-size:24px; margin:14px 0 6px; font-weight:800; }
    p { color:var(--ink2); font-size:14px; line-height:1.55; margin:0 0 24px; }
    .btn { display:block; width:100%; padding:15px; border-radius:18px; text-decoration:none;
      font-size:15px; font-weight:800; background:var(--primary); color:#fff; border-bottom:4px solid var(--primaryShadow); }
  </style>
</head>
<body>
  <div class="card">
    <div class="paw">🐾</div>
    <h1>PetCycle</h1>
    <p>반려동물 가족과 함께하는<br />돌봄 할 일 관리</p>
    <a class="btn" href="https://apps.apple.com/app/id6783009758">앱 설치하기</a>
  </div>
</body>
</html>
